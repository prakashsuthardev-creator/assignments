services:
  # Backend API Service Only
  - type: web
    name: assignment-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && cd apps/backend && pnpm exec prisma generate && pnpm run build
    startCommand: cd apps/backend && pnpm exec prisma migrate deploy && node -e "import('./dist/task2/seed-allowlist.js').then(m => m.seedAllowlist()).catch(console.error)" && node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: DATABASE_URL
        fromDatabase:
          name: assignment-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: HUBSPOT_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SECERET_KEY
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: FRONTEND_URL
        value: "*"
    healthCheckPath: /api/health

databases:
  - name: assignment-db
    databaseName: assignment
    plan: free
    region: singapore