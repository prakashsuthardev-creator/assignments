services:
  # Backend API Service
  - type: web
    name: assignment-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && cd apps/backend && pnpm exec prisma generate && pnpm build
    startCommand: cd apps/backend && node scripts/migrate-and-seed.js && node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: DATABASE_URL
        fromDatabase:
          name: assignment-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: HUBSPOT_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SECERET_KEY
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: FRONTEND_URL
        value: https://assignment-frontend.onrender.com
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: assignment-frontend
    runtime: static
    buildCommand: cd apps/frontend && bash build.sh
    staticPublishPath: apps/frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: VITE_API_URL
        value: https://assignment-backend.onrender.com

databases:
  - name: assignment-db
    databaseName: assignment
    plan: free
    region: singapore
