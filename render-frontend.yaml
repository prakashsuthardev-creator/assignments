services:
  # Frontend Static Site Only
  - type: web
    name: assignment-frontend
    runtime: static
    buildCommand: cd apps/frontend && bash build.sh
    staticPublishPath: apps/frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: VITE_API_URL
        value: https://assignment-backend-j6gb.onrender.com